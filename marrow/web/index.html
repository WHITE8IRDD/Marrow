<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marrow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111114'/%3E%3Cpath d='M8 23V9l8 9 8-9v14' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{                                   /* DARK: black + iOS greys, white as the "accent" */
  --bg:#000; --bg2:#0b0b0d; --panel:#1c1c1e; --panel2:#2c2c2e;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#f5f5f7; --muted:#98989f; --dim:#636366;
  --accent:#f2f2f7; --accent-text:#000; --accent-soft:rgba(255,255,255,.12);
  --a1:#f2f2f7; --a2:#8e8e93; --grad:none;
  --ok:#30d158; --warn:#ff9f0a; --bad:#ff453a; --info:#58a6ff;
  --r:24px; --r-card:24px; --r-ctl:999px; --ease:cubic-bezier(.32,.72,0,1);
  --shadow:0 8px 30px rgba(0,0,0,.45); --glass:rgba(28,28,30,.72);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI","Noto Sans Arabic",system-ui,sans-serif;
}
:root[data-theme="light"]{               /* LIGHT: OpusClip-style white */
  --bg:#f5f5f7; --bg2:#fff; --panel:#fff; --panel2:#f2f2f7;
  --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.12);
  --text:#111114; --muted:#6b6b76; --dim:#9a9aa5;
  --accent:#111114; --accent-text:#fff; --accent-soft:rgba(0,0,0,.08);
  --a1:#111114; --a2:#6b6b76; --grad:none;
  --ok:#1f9d43; --warn:#b25a00; --bad:#d70015; --info:#0366d6;
  --shadow:0 6px 24px rgba(20,20,40,.08); --glass:rgba(255,255,255,.72);
}
/* optional accent choice (default Graphite = --accent above) */
:root[data-accent="blue"]{--accent:#0a84ff;--accent-text:#fff;--accent-soft:rgba(10,132,255,.16);--a1:#0a84ff;--a2:#0a84ff}
:root[data-accent="green"]{--accent:#30d158;--accent-text:#000;--accent-soft:rgba(48,209,88,.16);--a1:#30d158;--a2:#30d158}
:root[data-accent="orange"]{--accent:#ff9f0a;--accent-text:#000;--accent-soft:rgba(255,159,10,.16);--a1:#ff9f0a;--a2:#ff9f0a}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]){
  --bg:#f5f5f7; --bg2:#fff; --panel:#fff; --panel2:#f2f2f7;
  --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.12);
  --text:#111114; --muted:#6b6b76; --dim:#9a9aa5;
  --accent:#111114; --accent-text:#fff; --accent-soft:rgba(0,0,0,.08);
  --a1:#111114; --a2:#6b6b76; --grad:none;
  --ok:#1f9d43; --warn:#b25a00; --bad:#d70015; --info:#0366d6;
  --shadow:0 6px 24px rgba(20,20,40,.08); --glass:rgba(255,255,255,.72);
} }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.5 Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
::selection{background:#888a}
#app{display:flex;min-height:100%}
/* sidebar */
.side{width:236px;flex:none;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;background:#0c0c11}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:700;font-size:18px;letter-spacing:.2px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.logo svg{stroke:var(--accent-text)}
.logo svg{width:18px;height:18px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.on{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--a1)}
.nav .count{margin-left:auto;background:var(--accent);color:var(--accent-text);border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px}
.engine{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);cursor:pointer}
.engine h4{margin:0 0 8px;font-size:11px;letter-spacing:.9px;color:var(--dim);text-transform:uppercase}
.dotrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:2px 0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 8px #27d17f88}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
/* main */
main{flex:1;min-width:0;padding:34px 40px 80px;max-width:1280px;margin:0 auto;width:100%}
.eyebrow{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:12px}
.hero{text-align:center;padding:34px 0 10px}
.hero h1{font-size:46px;line-height:1.1;font-weight:800;letter-spacing:-1px}
.hero p.sub{color:var(--muted);font-size:16px;margin:14px auto 28px;max-width:600px}
.dropbox{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:18px;transition:.15s}
.dropbox.drag{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.urlrow{display:flex;gap:10px}
.urlrow input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;font-size:15px;outline:none}
.urlrow input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.or{color:var(--dim);font-size:12px;margin:12px 0 10px;display:flex;align-items:center;gap:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.uprow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.filechip{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;max-width:100%}
.filechip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px;font-weight:600}
.upbar{height:4px;border-radius:4px;background:var(--line);margin-top:12px;overflow:hidden}
.upbar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s}
.banner{max-width:760px;margin:0 auto 16px;padding:11px 14px;border-radius:12px;font-size:13px;text-align:left;border:1px solid}
.banner.bad{border-color:#ff5d6c55;background:#ff5d6c14;color:#ffb3bb}
.banner.warn{border-color:#f5b73b55;background:#f5b73b12;color:#f6d28a}
.optcard{max-width:760px;margin:16px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;text-align:left}
.optcard>summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:600;display:flex;align-items:center;gap:10px;color:var(--muted)}
.optcard>summary::-webkit-details-marker{display:none}
.optcard>summary::after{content:"▾";margin-left:auto;transition:.15s}
.optcard[open]>summary::after{transform:rotate(180deg)}
.optcard .optbody{padding:4px 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}
.field label.fl,.fl{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:7px;letter-spacing:.2px}
.field.full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-text)}
input[type=range]{width:100%;accent-color:#8b6cff}
output{color:var(--text);font-weight:700;margin-left:8px}
input[type=number],input.txt,select{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;outline:none;min-width:0;width:100%}
input[type=number]{width:96px}
input.txt:focus,select:focus,input[type=number]:focus{border-color:var(--a1)}
select{appearance:auto}
input[type=color]{width:44px;height:34px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);padding:2px;cursor:pointer}
.colors{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.colors label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.tog{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.tog input{display:none}
.tog .knob{width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;transition:.15s;flex:none}
.tog .knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.tog input:checked+.knob{background:var(--a1)}
.tog input:checked+.knob::after{left:19px}
.tog .tl{font-weight:600}
.tog small{display:block;color:var(--dim);font-weight:400;font-size:11.5px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);border-radius:11px;padding:10px 16px;font-weight:600;cursor:pointer;transition:.12s;white-space:nowrap}
.btn:hover{border-color:#44445a;background:#1d1d27}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.danger{color:#ff8a96;border-color:#ff5d6c44}
.btn.danger:hover{background:#ff5d6c18}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn.lg{padding:14px 24px;font-size:15px}
.icon{background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;border-radius:8px;padding:5px 8px}
.icon:hover{background:var(--panel2);color:var(--text)}
/* sections */
.sechead{display:flex;align-items:center;justify-content:space-between;margin:44px 0 16px}
.sechead h2{font-size:20px;font-weight:700}
.search{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:9px 14px;outline:none;width:260px}
.search:focus{border-color:var(--a1)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:block;transition:.15s;position:relative}
.pcard:hover{border-color:#43435a;transform:translateY(-2px)}
.pthumb{aspect-ratio:16/10;background:linear-gradient(135deg,#1a1a26,#10101a);display:grid;place-items:center;position:relative;overflow:hidden}
.pthumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.pthumb .ph{color:var(--dim);font-size:30px}
.pbody{padding:12px 14px 14px}
.pbody h4{margin:0 0 4px;font-size:14px;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbody .m{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;border:1px solid}
.pill.done{color:#5fe3a2;border-color:#27d17f44;background:#27d17f12}
.pill.running{color:var(--text);border-color:var(--line2);background:var(--panel2)}
.pill.queued,.pill.cancelled{color:var(--muted);border-color:var(--line2)}
.pill.error{color:#ff8a96;border-color:#ff5d6c55;background:#ff5d6c12}
.pill .pd{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.running .pd{animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.25}}
.pcard .pill{position:absolute;top:10px;left:10px}
.pcard .pbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#0006}
.pcard .pbar i{display:block;height:100%;background:var(--accent)}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:44px 20px;text-align:center;color:var(--muted)}
/* project page */
.back{color:var(--muted);font-size:13px;display:inline-block;margin-bottom:10px}.back:hover{color:var(--text)}
.titlerow{display:flex;align-items:center;gap:8px}
.titlerow h2{font-size:26px;font-weight:800;letter-spacing:-.4px;overflow-wrap:anywhere}
.pmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:8px 0 16px}
.pmeta a{color:var(--accent)}.pmeta a:hover{text-decoration:underline}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.status{margin:22px 0 4px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.status .line{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;font-weight:600}
.status .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.status .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s;width:0}
.status .hint{color:var(--dim);font-size:12px;margin-top:10px}
.status.err{border-color:#ff5d6c55;background:#ff5d6c0d}
.status pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 0;color:#ffb3bb;font:12.5px/1.5 ui-monospace,Consolas,monospace}
.clipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;margin-top:22px}
.clip{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.vwrap{position:relative;aspect-ratio:9/16;background:#000}
.vwrap video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.score{position:absolute;top:10px;left:10px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;
  background:conic-gradient(var(--sc,#27d17f) calc(var(--v)*1%),#ffffff22 0);pointer-events:none}
.score span{width:36px;height:36px;border-radius:50%;background:#0b0b10ee;display:grid;place-items:center}
.score.hi{--sc:#27d17f}.score.mid{--sc:#f5b73b}.score.lo{--sc:#8c8c9f}
.ptabs{position:absolute;top:10px;right:10px;display:flex;gap:3px;background:#000a;border-radius:9px;padding:3px;backdrop-filter:blur(6px)}
.ptabs button{background:none;border:0;border-radius:6px;padding:4px 9px;font-size:11.5px;font-weight:700;color:#bbb;cursor:pointer}
.ptabs button.on{background:var(--accent);color:var(--accent-text)}
.rendering{position:absolute;inset:0;background:#000b;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;font-weight:600}
.spin{width:30px;height:30px;border:3px solid #ffffff33;border-top-color:#b455f7;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cbody{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.cbody h3{font-size:15px;line-height:1.35;font-weight:700}
.cmeta{color:var(--dim);font-size:12px}
.why{color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--accent-soft);color:var(--text);border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600}
.cerr{color:#ff9aa5;font-size:12px;background:#ff5d6c12;border-radius:8px;padding:8px 10px;word-break:break-word}
.crow{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
/* settings */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.card h3{font-size:15px;margin-bottom:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0}
.chk .t{font-weight:600}.chk .d{color:var(--muted);font-size:12.5px}
/* modal */
.backdrop{position:fixed;inset:0;background:#000c;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:20px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:18px;width:min(520px,100%);padding:22px;box-shadow:0 30px 80px #000a;max-height:92vh;overflow:auto}
.modal.wide{width:min(980px,100%)}
.modal h3{font-size:18px;margin-bottom:6px}
.modal .desc{color:var(--muted);margin-bottom:16px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 16px}
.tabs button{background:none;border:0;padding:9px 14px;color:var(--muted);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-color:var(--a1)}
.edgrid{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:22px}
.edgrid video{width:100%;max-height:420px;background:#000;border-radius:12px}
.trimrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.trimrow .fieldx{display:flex;flex-direction:column}
.words{display:flex;flex-wrap:wrap;gap:6px;max-height:300px;overflow:auto;padding:4px}
.words input{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:5px 8px;outline:none;min-width:40px}
.words input:focus{border-color:var(--a1)}
.words input.chg{border-color:var(--warn);background:#f5b73b14}
.note{color:var(--dim);font-size:12px;margin-top:8px}
#toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:80}
.toast{background:#1c1c27;border:1px solid var(--line2);border-left:3px solid var(--a1);border-radius:10px;padding:11px 16px;box-shadow:0 12px 30px #0009;max-width:380px;animation:in .2s}
.toast.bad{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(max-width:900px){
  #app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:10px 14px;gap:6px;overflow-x:auto}
  .logo{padding:0 10px 0 0}.engine{display:none}
  .nav{display:flex;gap:4px}.nav a{padding:8px 10px}
  main{padding:20px 16px 60px}
  .hero h1{font-size:32px}
  .optcard .optbody,.form,.edgrid{grid-template-columns:1fr}
  .urlrow{flex-direction:column}
}
/* ===== Marrow redesign: iOS pill system (appended; wins over the base above) ===== */
html,body{background:var(--bg);color:var(--text);
  font:14px/1.5 var(--font);letter-spacing:-.01em}
.side{margin:12px;border-radius:28px;background:var(--panel);
  border:1px solid var(--line);box-shadow:var(--shadow);height:calc(100vh - 24px)}
.nav a{border-radius:999px;padding:10px 16px;transition:background .25s var(--ease)}
.nav a.on{background:var(--panel2);color:var(--text);box-shadow:none}
.card,.optcard,.pcard,.clip,.modal,.engine,.status{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-card);box-shadow:var(--shadow)}
.btn{min-height:40px;padding:0 18px;border-radius:var(--r-ctl);font-weight:600;
  transition:transform .2s var(--ease),background .2s,filter .15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:transparent}
.btn.accent{background:var(--accent);color:var(--accent-text);border-color:transparent}
.btn.sm{min-height:32px;padding:0 14px} .btn.lg{min-height:52px;padding:0 28px}
.btn.danger{background:#ff453a1f;color:#ff453a;border-color:transparent}
input[type=text],input[type=number],input.txt,select{min-height:48px;border-radius:var(--r-ctl);
  background:var(--panel2);border:1px solid transparent;padding:0 18px}
.urlrow{border-radius:999px;padding:6px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.urlrow input[type=text]{background:transparent;border:0;min-height:44px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--panel2);border:0}
.seg button{border-radius:999px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]{accent-color:var(--accent)}
.pill{border-radius:999px;border:0;font-weight:600}
.pbar{border-radius:99px;background:var(--line2)}
.hero h1{font-weight:800;letter-spacing:-.04em;font-size:clamp(34px,5vw,56px)}
.eyebrow{color:var(--accent)}
.modal{border-radius:28px} .backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(8px)}
.themebtn{margin-top:8px;width:100%}
/* hardware panel */
.hw{display:grid;gap:10px;padding:14px 16px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.hw-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:13px}
.chip{border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.4px}
.chip.gpu{background:#30d15822;color:#30d158}.chip.cpu{background:#ff9f0a22;color:#ff9f0a}
.hw-row{display:grid;grid-template-columns:92px 1fr 118px;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.hw-bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.hw-bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s cubic-bezier(.32,.72,0,1)}
.hw-warn{font-size:12px;color:#ff9f0a;background:#ff9f0a14;border-radius:12px;padding:8px 10px}
.hw-row b{color:var(--text);font-weight:600;text-align:right}
/* caption style picker */
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.scard{container-type:inline-size;position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;cursor:pointer;
  background:linear-gradient(160deg,#4a4a52,#1a1a1d);border:2px solid transparent;transition:transform .2s cubic-bezier(.32,.72,0,1)}
.scard:hover{transform:translateY(-2px)}.scard.sel{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.scard .cap{position:absolute;left:6%;right:6%;text-align:center;line-height:1.25}
.scard .w{display:inline-block;margin:0 .1em;transition:transform .12s}
.scard .name{position:absolute;left:10px;top:10px;font:600 11px var(--font);padding:3px 9px;border-radius:99px;background:#0008;color:#fff}
.capprev{border-radius:24px;max-width:240px;box-shadow:0 10px 40px #0005}
/* live analysis scan panel (always dark: it is a screen) */
.scan{border-radius:24px;background:#0b0b0e;border:1px solid var(--line);padding:16px;color:#e8e8ee;display:grid;gap:12px}
.scan-head{display:flex;justify-content:space-between;align-items:center}
.stage{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.08);
  transition:box-shadow .9s var(--ease),border-color .9s}
.stage video{width:100%;height:100%;object-fit:cover;display:block;transition:filter .9s var(--ease)}
.scan[data-state=scanning] video{filter:grayscale(1) brightness(.42) contrast(1.15)}
.scan[data-state=live] .stage{border:1.5px solid var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 36px color-mix(in srgb,var(--accent) 40%,transparent)}
.grid{position:absolute;inset:0;opacity:.12;background:
  linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px) 0 0/100% 48px,linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px) 0 0/48px 100%}
.vline{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35);animation:drift 7s ease-in-out infinite alternate}
.vline.v1{left:22%}.vline.v2{left:61%;animation-duration:9s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(90px)}}
.hline{position:absolute;left:0;right:0;height:2px;top:0;background:linear-gradient(90deg,transparent,var(--accent),transparent);
  box-shadow:0 0 18px 3px color-mix(in srgb,var(--accent) 70%,transparent);animation:sweep 2.8s linear infinite}
@keyframes sweep{from{top:-2%}to{top:102%}}
.reticle{position:absolute;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.55);left:50%;top:50%;
  transform:translate(-50%,-50%);transition:left .9s var(--ease),top .9s var(--ease)}
.reticle::after{content:"";position:absolute;inset:50% auto auto 50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff}
.schip{position:absolute;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;background:rgba(10,12,24,.72);
  border:1px solid rgba(120,140,255,.25);backdrop-filter:blur(8px);font:600 10.5px ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.8px;color:#8fa2ff}
.schip.tl{top:12px;left:12px}.schip.tr{top:12px;right:12px;color:#aab}
.schip.live{top:12px;right:12px;background:#e5222f;border-color:transparent;color:#fff;display:none}
.schip.live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
.scan[data-state=live] .schip.live{display:flex}.scan[data-state=live] .schip.tr,
.scan[data-state=live] .hline,.scan[data-state=live] .vline,.scan[data-state=live] .grid,
.scan[data-state=live] .reticle,.scan[data-state=live] .schip.tl{display:none}
.mono.bl{position:absolute;left:12px;bottom:10px;font:10.5px/1.6 ui-monospace,"Cascadia Mono",Consolas,monospace;color:#6f7bd8}
.mono b{color:#8fa2ff;font-weight:600}.scan[data-state=live] .mono{display:none}
.strip{position:relative;height:46px;border-radius:12px;overflow:hidden;background:#15151a}
.strip img{width:100%;height:100%;object-fit:cover;opacity:.75}.strip .marks i{position:absolute;top:0;bottom:0;border-radius:4px}
.strip .head{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 8px #fff;transition:left .6s linear}
.logs summary{cursor:pointer;color:#9a9aa8;font-weight:600;font-size:12.5px;list-style:none;margin-bottom:8px}
.logbody{max-height:118px;overflow:auto;font:11.5px/1.7 ui-monospace,"Cascadia Mono",Consolas,monospace;color:#8b8b99;border-radius:14px;
  background:#0f0f14;padding:10px 12px}.logbody div{unicode-bidi:plaintext;animation:fadein .35s}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}}
/* dashboard + progressive clip cards */
.dash{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.dash{grid-template-columns:1fr}}
.shorts{display:grid;gap:14px}
.sc{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:12px;border-radius:22px;background:var(--panel);border:1px solid var(--line)}
.sc .vid{position:relative;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:#000}
.sc .vid video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.sc.rendering .vid::after{content:"AI MAGIC IN PROGRESS...";position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10px;
  font:700 10px ui-monospace,Consolas,monospace;letter-spacing:1px;color:#fff;background:rgba(20,20,26,.55);backdrop-filter:blur(10px) grayscale(1)}
.sc.rendering .vid{animation:shimmer 1.4s infinite linear;background:linear-gradient(110deg,#1c1c1e 30%,#2c2c2e 50%,#1c1c1e 70%);background-size:200% 100%}
@keyframes shimmer{to{background-position:-200% 0}}
.sc .blk{border-radius:12px;background:var(--panel2);padding:8px 10px;font-size:12px;position:relative}
.sc .blk small{display:block;color:var(--dim);font:700 9.5px var(--font);letter-spacing:.8px;margin-bottom:3px}
.sc .acts{display:flex;gap:8px;flex-wrap:wrap}
/* live caption overlay in edit modal */
.livewrap{container-type:inline-size}
/* home + dashboard layout (round 2) */
.home{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;max-width:1280px;margin:0 auto;align-items:start}
.home-right{position:sticky;top:12px;display:grid;gap:12px}
@media(max-width:1050px){.home{grid-template-columns:1fr}.home-right{position:static}}
.hero.compact{padding:18px 0 8px;text-align:left}
.hero.compact h1{font-size:clamp(28px,3.4vw,40px);margin:0 0 6px}
.hero.compact p{margin:0;font-size:14px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:260px;gap:14px;overflow-x:auto;padding-bottom:8px}
.foundcard{display:grid;grid-template-columns:220px 1fr;gap:14px;padding:12px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.foundcard video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px}
.foundcard .fmeta{display:grid;gap:4px;align-content:start}
.skel{border-radius:20px;background:var(--panel);border:1px solid var(--line);padding:12px;position:relative;overflow:hidden;min-height:150px}
.liveprev{position:relative;width:220px;aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,#3a3a42,#17171a);container-type:inline-size;flex:none}
.liveprev video{width:100%;height:100%;object-fit:cover;display:block}
.livecap{position:absolute;left:6%;right:6%;text-align:center;line-height:1.25}
.livecap .w{display:inline-block;margin:0 .1em;transition:transform .12s}
/* slim eta bar */
.etabar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.etabar .bar{flex:1;height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.etabar .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.etabar .t{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);font-weight:500}
/* slim hardware strip */
.hwslim{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.mmeter{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mmeter i{width:60px;height:6px;border-radius:99px;background:var(--line2);overflow:hidden;display:inline-block}
.mmeter i b{display:block;height:100%;background:var(--accent);border-radius:99px}
/* compact run layout */
.run{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);gap:14px;height:calc(100vh - 170px);min-height:480px}
.run>div:last-child{display:flex;flex-direction:column;gap:10px;min-height:0}
.run .tiles{flex:1}
.run-left{display:flex;flex-direction:column;gap:10px;min-height:0}
.run-left .stage{flex:1;min-height:0;aspect-ratio:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;overflow:auto;min-height:0}
@media(max-width:1000px){.run{grid-template-columns:1fr;height:auto}}
.tile{border-radius:18px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.tile .tv{position:relative;aspect-ratio:9/16;background:#000}
.tile .tv img,.tile .tv video{width:100%;height:100%;object-fit:cover;display:block}
.tile .tv img{filter:blur(2px) brightness(.6);transition:filter .4s}
.tile.ready .tv img{filter:none}
.tile .ring{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p,0)*1%),rgba(255,255,255,.18) 0);
  -webkit-mask:radial-gradient(circle 24px,transparent 98%,#000 100%);mask:radial-gradient(circle 24px,transparent 98%,#000 100%)}
.tile .ring b{font:700 12px var(--font);color:#fff}
.tile.queued .tv{opacity:.45}
.tile .tm{padding:8px 10px}
.tile .tt{font-weight:650;font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ts{color:var(--dim);font-size:11.5px;margin-top:3px;font-variant-numeric:tabular-nums}
/* finished clip grid */
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.clip{border-radius:20px;background:var(--panel);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.clip .vid{position:relative;aspect-ratio:9/16;background:#000}
.clip .vid video{width:100%;height:100%;object-fit:cover;display:block}
.clip .meta{padding:10px 12px;display:grid;gap:8px}
.clip h3{font-size:13.5px;line-height:1.35;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:start}
.clip .acts{display:flex;gap:6px}
.clip .acts .btn{flex:1;height:34px;padding:0 10px;font-size:12.5px;min-height:34px}
.clip .expand{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:0;font-size:15px;cursor:pointer}
.clip .dur{position:absolute;left:8px;bottom:8px;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700}
.menu{position:relative;flex:0 0 auto}
.menu summary{list-style:none;cursor:pointer}
.menu summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;bottom:calc(100% + 6px);min-width:190px;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:6px;display:grid;gap:2px;z-index:5;box-shadow:var(--shadow)}
.menu .pop button{background:none;border:0;text-align:start;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--text)}
.menu .pop button:hover{background:var(--line2)}
.menu .pop button.danger{color:var(--bad)}
/* fullscreen viewer */
.viewer{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);display:grid;place-items:center}
.viewer[hidden]{display:none}
.vbox{position:relative;height:min(88vh,900px);aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#000}
.vbox video{width:100%;height:100%;object-fit:contain;display:block}
.vt{position:absolute;left:0;right:0;top:0;padding:14px;background:linear-gradient(#000a,transparent);font-weight:650;color:#fff}
.viewer .vx,.viewer .vp,.viewer .vn{position:absolute;width:44px;height:44px;border-radius:50%;background:#ffffff22;color:#fff;border:0;font-size:20px;cursor:pointer;z-index:2}
.vx{top:18px;right:18px}.vp{left:24px;top:50%}.vn{right:24px;top:50%}
.vbar{position:absolute;bottom:18px;display:flex;gap:8px}
.vbox:fullscreen{height:100vh;aspect-ratio:auto;border-radius:0}
/* summary strip */
.sumstrip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted)}
/* perf containment */
.pcard,.sc,.tile,.clip,.scan{contain:layout paint}
.pgrid,.clips{content-visibility:auto;contain-intrinsic-size:auto 300px}
.cap-live{position:absolute;left:8%;right:8%;bottom:14%;text-align:center;line-height:1.3;pointer-events:none}
.cap-live span{margin:0 .12em}
.cap-live span.on{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app">
  <aside class="side">
    <div class="logo"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V6l7 8 7-8v13"/></svg></i>Marrow</div>
    <nav class="nav" id="nav">
      <a href="#/" data-r="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Home</a>
      <a href="#/projects" data-r="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projects<span class="count" id="navcount" hidden></span></a>
      <a href="#/settings" data-r="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
    </nav>
    <button class="btn ghost sm themebtn" id="themeBtn" title="Toggle light / dark theme">🌙 Theme</button>
    <div class="engine" id="engine" onclick="location.hash='#/settings'" title="Open settings"></div>
  </aside>
  <main id="main"></main>
</div>

<div id="modal-root"></div>

<script>
'use strict';
const setTheme = t => { if (t === 'system' || !t) document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = t; try { localStorage.setItem('theme', t); } catch (_) {} };
const setAccent = a => { if (a && a !== 'graphite') document.documentElement.dataset.accent = a;
  else document.documentElement.removeAttribute('data-accent'); try { localStorage.setItem('accent', a || 'graphite'); } catch (_) {} };
try {
  setTheme(localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  setAccent(localStorage.getItem('accent') || 'graphite');
} catch (_) { setTheme('dark'); }
document.getElementById('themeBtn').addEventListener('click', () => {
  setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
});
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ACTIVE = new Set(['queued', 'running']);
const state = { projects: [], system: null, settings: null, pending: null, uploadPct: null, url: '', opts: null, route: null };

/* ---------- api / utils ---------- */
async function api(path, o = {}) {
  const init = { method: o.method || 'GET', headers: { 'X-Marrow': '1' } };
  if (o.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(o.body); }
  const r = await fetch(path, init);
  let data = null; try { data = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error((data && data.error) || ('Request failed (' + r.status + ')'));
  return data;
}
function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), kind === 'bad' ? 7000 : 3500);
}
const fmtT = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const fmtDate = t => t ? new Date(t * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const platLabel = p => p === 'both' ? 'Shorts + Reels' : p === 'reels' ? 'Reels' : 'Shorts';
const hasActive = () => state.projects.some(p => ACTIVE.has(p.status) || p.clips.some(c => c.status === 'rendering'));
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); }
  catch (_) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast(okMsg, 'ok');
}

/* ---------- modal ---------- */
function openModal(html, wide) {
  closeModal();
  const b = document.createElement('div'); b.className = 'backdrop';
  b.innerHTML = '<div class="modal' + (wide ? ' wide' : '') + '">' + html + '</div>';
  b.addEventListener('mousedown', e => { if (e.target === b) closeModal(); });
  $('#modal-root').appendChild(b); return b.firstChild;
}
function closeModal() { const r = $('#modal-root'); const v = $('video', r); if (v) v.pause(); r.innerHTML = ''; editCtx = null; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function confirmBox({ title, text, ok = 'Confirm', danger = false, check = null }) {
  return new Promise(res => {
    const m = openModal(`<h3>${esc(title)}</h3><p class="desc">${esc(text)}</p>
      ${check ? `<label class="chk"><input type="checkbox" id="cb-check"><span><span class="t">${esc(check)}</span></span></label>` : ''}
      <div class="mfoot"><button class="btn ghost" id="cb-no">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="cb-yes">${esc(ok)}</button></div>`);
    $('#cb-no', m).onclick = () => { closeModal(); res({ ok: false }); };
    $('#cb-yes', m).onclick = () => { const c = $('#cb-check', m); closeModal(); res({ ok: true, checked: !!(c && c.checked) }); };
  });
}

/* ---------- option controls (shared by Home + Regenerate) ---------- */
const seg = (key, items, val) => `<div class="seg" data-opt="${key}">${items.map(([v, l]) =>

const Scan = (() => {

    else if (strip) strip.style.display = 'none';

    root.dataset.state = state;

    const model = (p.scan && p.scan.model) || p.engine?.transcribe?.model;

    $id('scanLabel').textContent = /download|prepar|extract/i.test(st) ? 'DOWNLOADING…' : /transcrib/i.test(st) ? 'TRANSCRIBING AUDIO...' : /scor|analy|rank/i.test(st) ? 'RANKING MOMENTS...' : 'SCANNING CONTENT...';
    $id('trs').textContent = /transcrib/i.test(st) ? 'PROCESSING' : 'DONE';

      }

      const box = $id('logbody');

  }

function mountLiveCaptions(video, words, st, start0) {
  const wrap = video.parentElement; wrap.style.position = 'relative'; wrap.classList.add('livewrap');
  let el = $('.cap-live', wrap);
  if (!el) { el = document.createElement('div'); el.className = 'cap-live'; wrap.appendChild(el); }
  const size = `calc(${(st.size || 72)} * 100cqw / 1080)`;
  const pos = st.position === 'center' ? 'top:38%;bottom:auto' : st.position === 'top' ? 'top:12%;bottom:auto' : '';
  el.setAttribute('style', `font-family:'${st.font || 'Arial'}',Arial;font-weight:${st.bold === false ? 400 : 700};` +
    `color:${st.text_color || '#fff'};font-size:${size};${pos};` +
    (st.shadow === 0 ? '' : `text-shadow:0 .06em .12em #000a;`));
  const per = st.max_words_per_line || 4;
  const step = () => {
    if (!document.contains(el)) return;
    const t = video.currentTime + start0;
    const i = words.findIndex(w => t >= w.s && t < w.e);
    if (i >= 0) {
      const a = Math.max(0, i - (i % per)), line = words.slice(a, a + per);
      el.innerHTML = line.map((w, j) => `<span class="${a + j === i ? 'on' : ''}">${esc(st.uppercase === false ? w.t : w.t.toUpperCase())}</span>`).join(' ');
    } else el.textContent = '';
    video.requestVideoFrameCallback ? video.requestVideoFrameCallback(step) : requestAnimationFrame(step);
  };
  step();
}

  async 'open-folder'() {
    try { const d = await api('/api/open-folder', { method: 'POST', body: { project: state.route.name === 'project' ? state.route.id : null } }); toast('Opened ' + d.path, 'ok'); }
    catch (e) { toast(e.message, 'bad'); }
  },
  'clip-plat'(b) {
    const { el, c } = clipOf(b); const pl = b.dataset.plat; el.dataset.plat = pl;
    $$('.ptabs button', el).forEach(x => x.classList.toggle('on', x === b));
    const v = $('video', el); const t = v.currentTime, was = !v.paused; v.src = c.urls[pl]; v.addEventListener('loadedmetadata', () => { v.currentTime = t; if (was) v.play(); }, { once: true });
    $('[data-act="dl"]', el).href = c.urls[pl] + '&download=1';
  },
  'copy-title'(b) { copyText(clipOf(b).c.title, 'Title copied'); const m = b.closest('details'); if (m) m.removeAttribute('open'); },
  'copy-tags'(b) { copyText(clipOf(b).c.hashtags.map(t => '#' + t).join(' '), 'Hashtags copied'); const m = b.closest('details'); if (m) m.removeAttribute('open'); },
  'copy-caption'(b) { const c = clipOf(b).c; copyText([c.reason, c.hashtags.map(t => '#' + t).join(' ')].filter(x => x).join(' '), 'Caption copied'); const m = b.closest('details'); if (m) m.removeAttribute('open'); },
  'toggle-analysis'(b) { const s = $('#scan'); if (s) s.hidden = !s.hidden; paintProject(curProject()); },
  'view-clip'(b) {
    const { el, p, c } = clipOf(b);
    const ready = p.clips.filter(x => x.status !== 'rendering' && x.urls && x.urls[x.platforms[0]]);
    const list = ready.map(x => { const pl = (x.rank === c.rank && el.dataset.plat) || x.platforms[0];
      return { url: x.urls[pl], download: x.urls[pl] + '&download=1', title: x.title }; });
    Viewer.open(list, Math.max(0, ready.findIndex(x => x.rank === c.rank)));
  },
  'edit-clip'(b) { const { p, c } = clipOf(b); openEdit(p, c); },
  'subs-clip'(b) { const { p, c } = clipOf(b); openEdit(p, c, 'caps'); },
  async 'del-clip'(b) {
    const { p, c } = clipOf(b);
    const r = await confirmBox({ title: 'Delete this clip?', text: `“${c.title}” will be removed from your disk.`, ok: 'Delete clip', danger: true });
    if (!r.ok) return;
    try { mergeProject(await api(`/api/projects/${p.id}/clips/${c.rank}`, { method: 'DELETE' })); toast('Clip deleted', 'ok'); } catch (e) { toast(e.message, 'bad'); }
  },
  async recheck() { $('#syscheck').textContent = 'Checking…'; await refreshSystem(true); paintSysCheck(); toast('Checked'); },
  'theme-toggle'() { setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'); },
  async 'dl-models'(b) {
    const st = $('#mdl-status'); b.disabled = true;
    try {
      await api('/api/models/download', { method: 'POST', body: {} });
      const poll = setInterval(async () => {
        try {
          const d = await api('/api/models/download');
          st.textContent = d.running ? `Downloading… ${d.done.join(', ')}` : (d.error ? `Failed: ${d.error}` : `Done: ${d.done.join(', ')}`);
          if (!d.running) { clearInterval(poll); b.disabled = false; toast(d.error ? d.error : 'Models downloaded', d.error ? 'bad' : 'ok'); }
        } catch (_) { clearInterval(poll); b.disabled = false; }
      }, 2000);
    } catch (e) { toast(e.message, 'bad'); b.disabled = false; }
  },
  async 'save-settings'() {
    try { state.settings = await api('/api/settings', { method: 'PUT', body: readSettings() }); state.opts = null; await refreshSystem(); viewSettings(); toast('Settings saved', 'ok'); }
    catch (e) { toast(e.message, 'bad'); }
  },
  async 'reset-settings'() {
    const r = await confirmBox({ title: 'Reset settings?', text: 'Restores the defaults from config.yaml.', ok: 'Reset' }); if (!r.ok) return;
    try { state.settings = await api('/api/settings', { method: 'PUT', body: {} }); state.opts = null; await refreshSystem(); viewSettings(); toast('Settings reset', 'ok'); } catch (e) { toast(e.message, 'bad'); }
  },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'A' && b.dataset.act === 'dl') return;
  const fn = actions[b.dataset.act]; if (fn) { e.preventDefault(); fn(b); }
});
// dropping a file anywhere should upload it (never navigate away to the file)
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault(); const f = e.dataTransfer?.files?.[0]; if (!f) return;
  if (state.route.name !== 'home') { location.hash = '#/'; setTimeout(() => handleFile(f), 50); } else handleFile(f);
});

/* ---------- router & polling ---------- */
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  if (h.startsWith('p/')) return { name: 'project', id: h.slice(2) };
  if (h === 'projects') return { name: 'projects' };
  if (h === 'settings') return { name: 'settings' };
  return { name: 'home' };
}
async function render() {
  const t0 = performance.now();
  state.route = parseRoute(); closeModal(); renderSide();
  if (state.route.name === 'home') viewHome();
  else if (state.route.name === 'projects') viewProjects();
  else if (state.route.name === 'project') viewProject();
  else if (state.route.name === 'settings') {
    if (state.settings && state.system) {
      viewSettings();   // instant from cache, then revalidate in parallel
      Promise.allSettled([refreshSystem(), api('/api/settings').then(s => { state.settings = s; })])
        .then(() => { if (state.route.name === 'settings') viewSettings(); });
    } else {
      await refreshSystem();
      try { state.settings = await api('/api/settings'); } catch (e) { toast(e.message, 'bad'); return; }
      if (state.route.name === 'settings') viewSettings();
    }
  }
  window.scrollTo(0, 0);
  console.debug(`[perf] route ${state.route.name}: ${Math.round(performance.now() - t0)} ms`);
}
window.addEventListener('hashchange', render);
async function refresh() {
  try {
    const keep = new Map(state.projects.map(p => [p.id, { log: p.log, logTotal: p.logTotal }]));
    state.projects = (await api('/api/projects')).projects;
    state.projects.forEach(p => { const k = keep.get(p.id); if (k && k.log) { p.log = k.log; p.logTotal = k.logTotal; } });
  } catch (_) { return; }
  renderSide();
  const r = state.route.name;
  if (r === 'home') paintRecent(); else if (r === 'projects') paintProjects();
  else if (r === 'project') { const p = curProject(); if (p) refreshProject(p.id); }
}
setInterval(() => { if (document.hidden) return; if (hasActive()) refresh(); }, 1500);
setInterval(() => { if (!document.hidden && !hasActive()) refresh(); }, 15000);
(async function init() {
  state.route = parseRoute();
  const [p, s, sys] = await Promise.allSettled([api('/api/projects'), api('/api/settings'), api('/api/system')]);
  if (p.status === 'fulfilled') state.projects = p.value.projects;
  if (s.status === 'fulfilled') state.settings = s.value;
  if (sys.status === 'fulfilled') state.system = sys.value;
  render();
})();
</script>
</body>
