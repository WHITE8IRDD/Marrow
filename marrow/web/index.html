<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marrow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d5efc'/%3E%3Cstop offset='1' stop-color='%23c04bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M8 23V9l8 9 8-9v14' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#09090d; --panel:#111118; --panel2:#17171f; --line:#23232e; --line2:#2e2e3b;
  --text:#ededf4; --muted:#8c8c9f; --dim:#62627a;
  --a1:#6d5efc; --a2:#b455f7; --grad:linear-gradient(135deg,#6d5efc 0%,#b455f7 100%);
  --ok:#27d17f; --warn:#f5b73b; --bad:#ff5d6c; --info:#58a6ff;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.5 Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
::selection{background:#6d5efc66}
#app{display:flex;min-height:100%}
/* sidebar */
.side{width:236px;flex:none;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;background:#0c0c11}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:700;font-size:18px;letter-spacing:.2px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 20px #6d5efc55}
.logo svg{width:18px;height:18px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.on{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--a1)}
.nav .count{margin-left:auto;background:var(--grad);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px}
.engine{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);cursor:pointer}
.engine h4{margin:0 0 8px;font-size:11px;letter-spacing:.9px;color:var(--dim);text-transform:uppercase}
.dotrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:2px 0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 8px #27d17f88}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
/* main */
main{flex:1;min-width:0;padding:34px 40px 80px;max-width:1280px;margin:0 auto;width:100%}
.eyebrow{color:#a99cff;font-weight:700;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:12px}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{text-align:center;padding:34px 0 10px}
.hero h1{font-size:46px;line-height:1.1;font-weight:800;letter-spacing:-1px}
.hero p.sub{color:var(--muted);font-size:16px;margin:14px auto 28px;max-width:600px}
.dropbox{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:18px;transition:.15s}
.dropbox.drag{border-color:var(--a1);box-shadow:0 0 0 4px #6d5efc33;background:#14141f}
.urlrow{display:flex;gap:10px}
.urlrow input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;font-size:15px;outline:none}
.urlrow input[type=text]:focus{border-color:var(--a1);box-shadow:0 0 0 3px #6d5efc33}
.or{color:var(--dim);font-size:12px;margin:12px 0 10px;display:flex;align-items:center;gap:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.uprow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.filechip{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;max-width:100%}
.filechip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px;font-weight:600}
.upbar{height:4px;border-radius:4px;background:var(--line);margin-top:12px;overflow:hidden}
.upbar>i{display:block;height:100%;background:var(--grad);width:0;transition:width .15s}
.banner{max-width:760px;margin:0 auto 16px;padding:11px 14px;border-radius:12px;font-size:13px;text-align:left;border:1px solid}
.banner.bad{border-color:#ff5d6c55;background:#ff5d6c14;color:#ffb3bb}
.banner.warn{border-color:#f5b73b55;background:#f5b73b12;color:#f6d28a}
.optcard{max-width:760px;margin:16px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;text-align:left}
.optcard>summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:600;display:flex;align-items:center;gap:10px;color:var(--muted)}
.optcard>summary::-webkit-details-marker{display:none}
.optcard>summary::after{content:"▾";margin-left:auto;transition:.15s}
.optcard[open]>summary::after{transform:rotate(180deg)}
.optcard .optbody{padding:4px 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}
.field label.fl,.fl{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:7px;letter-spacing:.2px}
.field.full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--grad);color:#fff}
input[type=range]{width:100%;accent-color:#8b6cff}
output{color:var(--text);font-weight:700;margin-left:8px}
input[type=number],input.txt,select{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;outline:none;min-width:0;width:100%}
input[type=number]{width:96px}
input.txt:focus,select:focus,input[type=number]:focus{border-color:var(--a1)}
select{appearance:auto}
input[type=color]{width:44px;height:34px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);padding:2px;cursor:pointer}
.colors{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.colors label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.tog{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.tog input{display:none}
.tog .knob{width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;transition:.15s;flex:none}
.tog .knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.tog input:checked+.knob{background:var(--a1)}
.tog input:checked+.knob::after{left:19px}
.tog .tl{font-weight:600}
.tog small{display:block;color:var(--dim);font-weight:400;font-size:11.5px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);border-radius:11px;padding:10px 16px;font-weight:600;cursor:pointer;transition:.12s;white-space:nowrap}
.btn:hover{border-color:#44445a;background:#1d1d27}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 24px #6d5efc44}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.danger{color:#ff8a96;border-color:#ff5d6c44}
.btn.danger:hover{background:#ff5d6c18}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn.lg{padding:14px 24px;font-size:15px}
.icon{background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;border-radius:8px;padding:5px 8px}
.icon:hover{background:var(--panel2);color:var(--text)}
/* sections */
.sechead{display:flex;align-items:center;justify-content:space-between;margin:44px 0 16px}
.sechead h2{font-size:20px;font-weight:700}
.search{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:9px 14px;outline:none;width:260px}
.search:focus{border-color:var(--a1)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:block;transition:.15s;position:relative}
.pcard:hover{border-color:#43435a;transform:translateY(-2px)}
.pthumb{aspect-ratio:16/10;background:linear-gradient(135deg,#1a1a26,#10101a);display:grid;place-items:center;position:relative;overflow:hidden}
.pthumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.pthumb .ph{color:var(--dim);font-size:30px}
.pbody{padding:12px 14px 14px}
.pbody h4{margin:0 0 4px;font-size:14px;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbody .m{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;border:1px solid}
.pill.done{color:#5fe3a2;border-color:#27d17f44;background:#27d17f12}
.pill.running{color:#b6a9ff;border-color:#6d5efc66;background:#6d5efc18}
.pill.queued,.pill.cancelled{color:var(--muted);border-color:var(--line2)}
.pill.error{color:#ff8a96;border-color:#ff5d6c55;background:#ff5d6c12}
.pill .pd{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.running .pd{animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.25}}
.pcard .pill{position:absolute;top:10px;left:10px}
.pcard .pbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#0006}
.pcard .pbar i{display:block;height:100%;background:var(--grad)}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:44px 20px;text-align:center;color:var(--muted)}
/* project page */
.back{color:var(--muted);font-size:13px;display:inline-block;margin-bottom:10px}.back:hover{color:var(--text)}
.titlerow{display:flex;align-items:center;gap:8px}
.titlerow h2{font-size:26px;font-weight:800;letter-spacing:-.4px;overflow-wrap:anywhere}
.pmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:8px 0 16px}
.pmeta a{color:#a99cff}.pmeta a:hover{text-decoration:underline}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.status{margin:22px 0 4px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.status .line{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;font-weight:600}
.status .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.status .bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s;width:0}
.status .hint{color:var(--dim);font-size:12px;margin-top:10px}
.status.err{border-color:#ff5d6c55;background:#ff5d6c0d}
.status pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 0;color:#ffb3bb;font:12.5px/1.5 ui-monospace,Consolas,monospace}
.clipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;margin-top:22px}
.clip{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.vwrap{position:relative;aspect-ratio:9/16;background:#000}
.vwrap video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.score{position:absolute;top:10px;left:10px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;
  background:conic-gradient(var(--sc,#27d17f) calc(var(--v)*1%),#ffffff22 0);pointer-events:none}
.score span{width:36px;height:36px;border-radius:50%;background:#0b0b10ee;display:grid;place-items:center}
.score.hi{--sc:#27d17f}.score.mid{--sc:#f5b73b}.score.lo{--sc:#8c8c9f}
.ptabs{position:absolute;top:10px;right:10px;display:flex;gap:3px;background:#000a;border-radius:9px;padding:3px;backdrop-filter:blur(6px)}
.ptabs button{background:none;border:0;border-radius:6px;padding:4px 9px;font-size:11.5px;font-weight:700;color:#bbb;cursor:pointer}
.ptabs button.on{background:var(--grad);color:#fff}
.rendering{position:absolute;inset:0;background:#000b;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;font-weight:600}
.spin{width:30px;height:30px;border:3px solid #ffffff33;border-top-color:#b455f7;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cbody{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.cbody h3{font-size:15px;line-height:1.35;font-weight:700}
.cmeta{color:var(--dim);font-size:12px}
.why{color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:#6d5efc1c;color:#b6a9ff;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600}
.cerr{color:#ff9aa5;font-size:12px;background:#ff5d6c12;border-radius:8px;padding:8px 10px;word-break:break-word}
.crow{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
/* settings */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.card h3{font-size:15px;margin-bottom:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0}
.chk .t{font-weight:600}.chk .d{color:var(--muted);font-size:12.5px}
/* modal */
.backdrop{position:fixed;inset:0;background:#000c;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:20px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:18px;width:min(520px,100%);padding:22px;box-shadow:0 30px 80px #000a;max-height:92vh;overflow:auto}
.modal.wide{width:min(980px,100%)}
.modal h3{font-size:18px;margin-bottom:6px}
.modal .desc{color:var(--muted);margin-bottom:16px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 16px}
.tabs button{background:none;border:0;padding:9px 14px;color:var(--muted);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-color:var(--a1)}
.edgrid{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:22px}
.edgrid video{width:100%;max-height:420px;background:#000;border-radius:12px}
.trimrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.trimrow .fieldx{display:flex;flex-direction:column}
.words{display:flex;flex-wrap:wrap;gap:6px;max-height:300px;overflow:auto;padding:4px}
.words input{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:5px 8px;outline:none;min-width:40px}
.words input:focus{border-color:var(--a1)}
.words input.chg{border-color:var(--warn);background:#f5b73b14}
.note{color:var(--dim);font-size:12px;margin-top:8px}
#toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:80}
.toast{background:#1c1c27;border:1px solid var(--line2);border-left:3px solid var(--a1);border-radius:10px;padding:11px 16px;box-shadow:0 12px 30px #0009;max-width:380px;animation:in .2s}
.toast.bad{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(max-width:900px){
  #app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:10px 14px;gap:6px;overflow-x:auto}
  .logo{padding:0 10px 0 0}.engine{display:none}
  .nav{display:flex;gap:4px}.nav a{padding:8px 10px}
  main{padding:20px 16px 60px}
  .hero h1{font-size:32px}
  .optcard .optbody,.form,.edgrid{grid-template-columns:1fr}
  .urlrow{flex-direction:column}
}
</style>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="logo"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V6l7 8 7-8v13"/></svg></i>Marrow</div>
    <nav class="nav" id="nav">
      <a href="#/" data-r="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Home</a>
      <a href="#/projects" data-r="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projects<span class="count" id="navcount" hidden></span></a>
      <a href="#/settings" data-r="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
    </nav>
    <div class="engine" id="engine" onclick="location.hash='#/settings'" title="Open settings"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="toasts"></div>
<div id="modal-root"></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ACTIVE = new Set(['queued', 'running']);
const state = { projects: [], system: null, settings: null, pending: null, uploadPct: null, url: '', opts: null, route: null };

/* ---------- api / utils ---------- */
async function api(path, o = {}) {
  const init = { method: o.method || 'GET', headers: { 'X-Marrow': '1' } };
  if (o.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(o.body); }
  const r = await fetch(path, init);
  let data = null; try { data = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error((data && data.error) || ('Request failed (' + r.status + ')'));
  return data;
}
function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), kind === 'bad' ? 7000 : 3500);
}
const fmtT = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const fmtDate = t => t ? new Date(t * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const platLabel = p => p === 'both' ? 'Shorts + Reels' : p === 'reels' ? 'Reels' : 'Shorts';
const hasActive = () => state.projects.some(p => ACTIVE.has(p.status) || p.clips.some(c => c.status === 'rendering'));
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); }
  catch (_) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast(okMsg, 'ok');
}

/* ---------- modal ---------- */

  b.innerHTML = '<div class="modal' + (wide ? ' wide' : '') + '">' + html + '</div>';

}
function closeModal() { const r = $('#modal-root'); const v = $('video', r); if (v) v.pause(); r.innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function confirmBox({ title, text, ok = 'Confirm', danger = false, check = null }) {
  return new Promise(res => {
    const m = openModal(`<h3>${esc(title)}</h3><p class="desc">${esc(text)}</p>
      ${check ? `<label class="chk"><input type="checkbox" id="cb-check"><span><span class="t">${esc(check)}</span></span></label>` : ''}
      <div class="mfoot"><button class="btn ghost" id="cb-no">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="cb-yes">${esc(ok)}</button></div>`);

/* ---------- option controls (shared by Home + Regenerate) ---------- */
const seg = (key, items, val) => `<div class="seg" data-opt="${key}">${items.map(([v, l]) =>
  `<button type="button" class="${v === val ? 'on' : ''}" data-v="${v}" data-act="seg">${l}</button>`).join('')}</div>`;
const tog = (key, label, on, hint) => `<label class="tog"><input type="checkbox" data-opt="${key}" ${on ? 'checked' : ''}><span class="knob"></span><span class="tl">${label}${hint ? `<small>${hint}</small>` : ''}</span></label>`;
function optsPanel(o) {
  const cs = o.caption_style;
  const llmWarn = state.system && !(state.system.ollama.reachable && state.system.ollama.model_ready)
    ? (state.system.ollama.reachable ? `Model "${esc(state.system.ollama.model)}" isn't pulled yet. Clips will be ranked by audio and heuristics.` : 'Ollama isn\'t running. Clips will be ranked by audio and heuristics.') : 'Uses your local Ollama model to judge hook, payoff and clarity';
  return `<div class="optbody">
    <div class="field"><span class="fl">Output format</span>${seg('platform', [['shorts', 'YouTube Shorts'], ['reels', 'Facebook Reels'], ['both', 'Both']], o.platform)}</div>
    <div class="field"><span class="fl">Framing</span>${seg('layout', [['crop', 'Center crop'], ['blur_fit', 'Blur fit']], o.layout)}</div>
    <div class="field"><span class="fl">Number of clips</span><input type="number" min="1" max="20" data-opt="clips" value="${o.clips}"></div>
    <div class="field"><span class="fl">Target length<output>${o.duration}s</output></span><input type="range" min="15" max="120" step="5" data-opt="duration" data-unit="s" value="${o.duration}"></div>
    <div class="field">${tog('captions', 'Animated captions', o.captions, 'Burn word-by-word captions into the video')}</div>
    <div class="field">${tog('use_llm', 'AI clip scoring', o.use_llm, llmWarn)}</div>
    <div class="field">${tog('zoom', 'Slow zoom', o.zoom, 'Subtle push-in (center crop only, slower)')}</div>
    <div class="field">${tog('uppercase', 'Uppercase captions', cs.uppercase)}</div>
    <div class="field full"><span class="fl">Caption colors &amp; size</span><div class="colors">
      <label><input type="color" data-opt="highlight_color" value="${cs.highlight_color}">Active word</label>
      <label><input type="color" data-opt="text_color" value="${cs.text_color}">Other words</label>
      <label style="flex:1;min-width:180px">Size<input type="range" min="40" max="110" data-opt="font_size" data-unit="" value="${cs.font_size}"><output>${cs.font_size}</output></label>
    </div></div></div>`;
}
function readOpts(root) {
  const o = { caption_style: {} };
  $$('[data-opt]', root).forEach(el => {
    const k = el.dataset.opt; let v;
    if (el.classList.contains('seg')) v = $('.on', el)?.dataset.v;
    else if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'range' || el.type === 'number') v = Number(el.value);
    else v = el.value;
    if (['highlight_color', 'text_color', 'font_size', 'uppercase'].includes(k)) o.caption_style[k] = v; else o[k] = v;
  });
  return o;
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.type === 'range' && el.dataset.opt) { const out = el.parentElement.querySelector('output') || el.previousElementSibling?.querySelector?.('output'); if (out) out.textContent = el.value + (el.dataset.unit || ''); }
});

  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === r || (r === 'project' && a.dataset.r === 'projects')));
  const n = state.projects.filter(p => ACTIVE.has(p.status)).length;

  const s = state.system;

  $('#engine').innerHTML = '<h4>Engine</h4>' + (!s ? row('', 'Checking…') : [
    row(s.ffmpeg ? 'ok' : 'bad', s.ffmpeg ? 'FFmpeg ready' : 'FFmpeg missing'),
    s.ollama.reachable && s.ollama.model_ready ? row('ok', 'AI scoring ready') : row(s.ollama.reachable ? 'warn' : '', s.ollama.reachable ? 'AI model not pulled' : 'AI off (heuristics)'),
    row(s.gpu ? 'ok' : '', s.gpu ? 'CUDA GPU found' : 'CPU mode')].join(''));

async function refreshSystem() { try { state.system = await api('/api/system'); } catch (_) {} renderSide(); }

/* ---------- project card (home + projects) ---------- */
function projectCard(p) {

  const meta = p.status === 'done' ? `${p.clips.length} clip${p.clips.length === 1 ? '' : 's'} · ${platLabel(p.settings.platform)}` :

const projSig = list => JSON.stringify(list.map(p => [p.id, p.status, p.stage, p.progress, p.name, p.thumb, p.clips.length]));

}
function paintUploadRow() {
  const row = $('#uprow'); if (!row) return;
  const p = state.pending;
  if (p) row.innerHTML = `<div class="filechip">🎞 <b>${esc(p.name)}</b><span>${p.upload ? '✓ uploaded' : Math.round((state.uploadPct || 0) * 100) + '%'}</span><button class="icon" data-act="rm-upload" title="Remove">✕</button></div>`;
  else row.innerHTML = `<label class="btn ghost">⬆ Upload a video<input type="file" id="file" accept="video/*,.mkv" hidden></label><span>or drag &amp; drop a file here (mp4, mov, mkv, webm)</span>`;
  const f = $('#file', row); if (f) f.onchange = () => { if (f.files[0]) handleFile(f.files[0]); };
  const bar = $('#upbar'); if (bar) { bar.hidden = !(p && !p.upload); $('i', bar).style.width = Math.round((state.uploadPct || 0) * 100) + '%'; }
}
function clearPending() { if (state.pending) { state.pending = null; state.uploadPct = null; paintUploadRow(); } }
function paintRecent() {
  const r = $('#recent'); if (!r) return;
  const list = state.projects.slice(0, 4);
  const sig = projSig(list); if (r.dataset.sig === sig) return; r.dataset.sig = sig;
  r.innerHTML = list.length ? `<div class="pgrid">${list.map(projectCard).join('')}</div>` : `<div class="empty">No projects yet. Paste a link above to make your first clips.</div>`;
}
function handleFile(file) {
  if (!/\.(mp4|mov|mkv|webm|avi|m4v)$/i.test(file.name)) { toast('Unsupported file type. Use mp4, mov, mkv, webm, avi or m4v.', 'bad'); return; }
  state.url = ''; const u = $('#url'); if (u) u.value = '';
  state.pending = { name: file.name, upload: null }; state.uploadPct = 0; paintUploadRow();
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload?filename=' + encodeURIComponent(file.name));
  xhr.setRequestHeader('X-Marrow', '1');
  xhr.upload.onprogress = e => { if (e.lengthComputable) { state.uploadPct = e.loaded / e.total; paintUploadRow(); } };
  xhr.onload = () => {
    let d = {}; try { d = JSON.parse(xhr.responseText); } catch (_) {}
    if (xhr.status < 300 && d.upload) { state.pending = { name: file.name, upload: d.upload }; paintUploadRow(); toast('Upload complete. Press “Get clips”.', 'ok'); }
    else { state.pending = null; paintUploadRow(); toast(d.error || 'Upload failed', 'bad'); }
  };
  xhr.onerror = () => { state.pending = null; paintUploadRow(); toast('Upload failed (connection lost).', 'bad'); };
  xhr.send(file);
}
async function startProject() {
  const url = ($('#url')?.value || '').trim();
  const pend = state.pending;
  if (pend && !pend.upload) { toast('Wait for the upload to finish.'); return; }
  if (!url && !pend) { toast('Paste a video link or upload a file first.', 'bad'); $('#url')?.focus(); return; }
  const settings = readOpts($('#optbox')); state.opts = settings;
  const btn = $('#go'); btn.disabled = true;
  try {
    const p = await api('/api/projects', { method: 'POST', body: pend ? { upload: pend.upload, settings } : { url, settings } });
    state.url = ''; clearPending(); state.projects.unshift(p);
    location.hash = '#/p/' + p.id;
  } catch (e) { toast(e.message, 'bad'); btn.disabled = false; }
}

function viewProjects() {
  main.innerHTML = `<div class="sechead" style="margin-top:0"><h2>Projects</h2><input class="search" id="search" placeholder="Search projects…"></div><div id="plist"></div>`;
  $('#search').addEventListener('input', paintProjects); paintProjects();
}
function paintProjects() {

  const q = ($('#search')?.value || '').toLowerCase();
  const list = state.projects.filter(p => p.name.toLowerCase().includes(q) || (p.source || '').toLowerCase().includes(q));

/* ----- project page ----- */
function curProject() { return state.projects.find(p => p.id === state.route.id); }
function viewProject() {
  const p = curProject();
  if (!p) { main.innerHTML = `<div class="empty">Project not found. <a class="grad" href="#/projects">Back to projects</a></div>`; return; }
  main.innerHTML = `<a class="back" href="#/projects">← Projects</a>
    <div class="titlerow"><h2 id="pname"></h2><button class="icon" data-act="rename" title="Rename project">✎</button></div>
    <div class="pmeta" id="pmeta"></div><div class="actions" id="pactions"></div>
    <div id="pstatus"></div><div class="clipgrid" id="clipgrid"></div>`;
  paintProject(p, true);
}
function paintProject(p, force) {
  $('#pname').textContent = p.name;
  const src = p.source_kind === 'url' ? `<a href="${esc(p.source)}" target="_blank" rel="noopener">Source ↗</a>` : `<span>${p.source_kind === 'upload' ? 'Uploaded file' : 'Local file'}</span>`;
  $('#pmeta').innerHTML = `<span class="pill ${p.status}"><i class="pd"></i>${p.status === 'done' ? 'Ready' : p.status}</span><span>${platLabel(p.settings.platform)}</span><span>${fmtDate(p.created)}</span>${src}`;
  const asig = p.status + ':' + p.clips.length;
  const act = $('#pactions');
  if (force || act.dataset.sig !== asig) {
    act.dataset.sig = asig;
    const del = `<button class="btn danger" data-act="del-project">Delete</button>`;
    act.innerHTML = ACTIVE.has(p.status)
      ? `<button class="btn danger" data-act="cancel">Cancel</button>`
      : (p.status === 'done'
        ? `<button class="btn primary" data-act="regen">↻ Regenerate</button>${p.clips.length ? `<a class="btn" href="/api/projects/${p.id}/zip" download>⬇ Download all (.zip)</a>` : ''}<button class="btn" data-act="open-folder">📂 Open folder</button>${del}`
        : `<button class="btn primary" data-act="regen">↻ Try again</button>${del}`);
  }
  // status panel
  const ps = $('#pstatus');
  if (ACTIVE.has(p.status)) {
    if (!$('#bar', ps)) ps.innerHTML = `<div class="status"><div class="line"><span id="stage"></span><span id="pct"></span></div><div class="bar"><i id="bar"></i></div><div class="hint" id="hint"></div></div>`;
    $('#stage').textContent = p.stage; $('#pct').textContent = Math.round(p.progress * 100) + '%';
    $('#bar').style.width = Math.round(p.progress * 100) + '%';
    const el = p.started ? Math.max(0, Date.now() / 1000 - p.started) : 0;
    $('#hint').textContent = p.status === 'queued' ? 'Another job is running. This one starts automatically when it finishes.' :
      `Running for ${fmtT(el)}. Transcription is the slowest step; results are cached, so re-runs are much faster.`;
  } else if (p.status === 'error') {
    ps.innerHTML = `<div class="status err"><div class="line"><span>Something went wrong</span></div><pre>${esc(p.error || 'Unknown error')}</pre></div>`;
  } else if (p.status === 'cancelled') {
    ps.innerHTML = `<div class="status"><div class="line"><span>Cancelled</span></div><div class="hint">Nothing was exported. Use “Try again” to rerun it (cached steps are reused).</div></div>`;
  } else ps.innerHTML = '';
  // clips
  const grid = $('#clipgrid'); const have = new Map($$('.clip', grid).map(e => [e.dataset.rank, e]));
  const want = new Set(p.clips.map(c => String(c.rank)));
  have.forEach((el, k) => { if (!want.has(k)) el.remove(); });
  p.clips.forEach(c => {
    const sig = [c.rev, c.status, c.title, c.last_error, c.hashtags.join(','), c.start, c.end, c.urls[c.platforms[0]]].join('|');
    const old = have.get(String(c.rank));
    if (old && old.dataset.sig === sig) return;
    const el = cardEl(p, c, sig);
    if (old) old.replaceWith(el); else grid.appendChild(el);
  });
  if (p.status === 'done' && !p.clips.length) grid.innerHTML = `<div class="empty" style="grid-column:1/-1">This project has no clips left.</div>`;
}
const scoreCls = s => s >= .7 ? 'hi' : s >= .5 ? 'mid' : 'lo';
function cardEl(p, c, sig) {
  const cur = c.platforms[0], el = document.createElement('article');
  el.className = 'clip'; el.dataset.rank = c.rank; el.dataset.sig = sig; el.dataset.plat = cur;
  const sc = Math.round(c.score * 100);
  el.innerHTML = `<div class="vwrap">
      <video playsinline controls preload="metadata" ${c.thumb ? `poster="${c.thumb}"` : ''} src="${c.urls[cur]}"></video>
      <div class="score ${scoreCls(c.score)}" style="--v:${sc}" title="Marrow score: how strongly this moment ranked"><span>${sc}</span></div>
      ${c.platforms.length > 1 ? `<div class="ptabs">${c.platforms.map(pl => `<button data-act="clip-plat" data-plat="${pl}" class="${pl === cur ? 'on' : ''}">${pl === 'shorts' ? 'Shorts' : 'Reels'}</button>`).join('')}</div>` : ''}
      ${c.status === 'rendering' ? `<div class="rendering"><div class="spin"></div>Re-rendering…</div>` : ''}</div>
    <div class="cbody"><h3>${esc(c.title)}</h3>
      <div class="cmeta">${fmtT(c.duration)} · source ${fmtT(c.start)}–${fmtT(c.end)}</div>
      ${c.reason ? `<p class="why">${esc(c.reason)}</p>` : ''}
      ${c.hashtags.length ? `<div class="tags">${c.hashtags.map(t => `<span>#${esc(t)}</span>`).join('')}</div>` : ''}
      ${c.last_error ? `<div class="cerr">Last re-render failed: ${esc(c.last_error)}</div>` : ''}
      <div class="crow">
        <a class="btn primary sm" data-act="dl" href="${c.urls[cur]}&download=1" download>⬇ Download</a>
        <button class="btn sm" data-act="copy-title">Copy title</button>
        ${c.hashtags.length ? `<button class="btn sm" data-act="copy-tags">Copy tags</button>` : ''}
        <button class="btn sm" data-act="edit-clip" ${c.status === 'rendering' ? 'disabled' : ''}>✂ Edit</button>
        <button class="btn sm danger" data-act="del-clip" ${c.status === 'rendering' ? 'disabled' : ''}>🗑</button>
      </div></div>`;
  return el;
}

  $('#ed-sets', m).onclick = () => { S.value = v.currentTime.toFixed(2); upd(); };
  $('#ed-sete', m).onclick = () => { E.value = v.currentTime.toFixed(2); upd(); };
  $('#ed-prev', m).onclick = () => { v.currentTime = +S.value; v.play(); const stop = () => { if (v.currentTime >= +E.value) { v.pause(); v.removeEventListener('timeupdate', stop); } }; v.addEventListener('timeupdate', stop); };
  $$('.tabs button', m).forEach(b => b.onclick = () => { $$('.tabs button', m).forEach(x => x.classList.toggle('on', x === b)); $$('[data-pane]', m).forEach(pn => pn.hidden = pn.dataset.pane !== b.dataset.tab); });
  const words = new Map();
  async function loadWords() {
    const box = $('#ed-words', m); box.innerHTML = '<span class="note">Loading words…</span>';
    try {
      const d = await api(`/api/projects/${p.id}/clips/${c.rank}/transcript?start=${encodeURIComponent(S.value)}&end=${encodeURIComponent(E.value)}`);
      words.clear(); box.innerHTML = '';
      d.words.forEach(w => {
        words.set(w.i, w.t); const inp = document.createElement('input'); inp.value = w.t; inp.dataset.i = w.i; inp.size = Math.max(3, w.t.length);
        inp.title = fmtT(w.s); inp.oninput = () => { inp.classList.toggle('chg', inp.value.trim() !== words.get(w.i)); inp.size = Math.max(3, inp.value.length); };
        box.appendChild(inp);
      });
      if (!d.words.length) box.innerHTML = '<span class="note">No words in this range.</span>';
    } catch (e) { box.innerHTML = `<span class="note">${esc(e.message)}</span>`; }
  }
  $('#ed-reload', m).onclick = loadWords; loadWords();
  $('#ed-cancel', m).onclick = closeModal;
  $('#ed-saveinfo', m).onclick = async () => {
    try { const np = await api(`/api/projects/${p.id}/clips/${c.rank}`, { method: 'PATCH', body: { title: $('#ed-title', m).value, hashtags: $('#ed-tags', m).value } });
      mergeProject(np); toast('Saved', 'ok'); } catch (e) { toast(e.message, 'bad'); }
  };
  $('#ed-go', m).onclick = async () => {
    const edits = {}; $$('#ed-words input', m).forEach(i => { if (i.value.trim() && i.value.trim() !== words.get(+i.dataset.i)) edits[i.dataset.i] = i.value.trim(); });
    const btn = $('#ed-go', m); btn.disabled = true;
    try {
      const np = await api(`/api/projects/${p.id}/clips/${c.rank}/rerender`, { method: 'POST', body: {
        start: +S.value, end: +E.value, captions: $('[data-opt="ed-cap"]', m).checked, edits,
        style: { highlight_color: $('#ed-hl', m).value, text_color: $('#ed-tc', m).value, uppercase: $('[data-opt="ed-up"]', m).checked } } });
      mergeProject(np); closeModal(); toast('Re-rendering clip…');
    } catch (e) { toast(e.message, 'bad'); btn.disabled = false; }
  };
}
function mergeProject(np) {
  const i = state.projects.findIndex(x => x.id === np.id); if (i >= 0) state.projects[i] = np; else state.projects.unshift(np);
  if (state.route.name === 'project' && state.route.id === np.id) paintProject(np);
  renderSide();
}

/* ----- settings ----- */
function viewSettings() {
  const d = state.settings, s = d.settings, sys = state.system;
  const models = sys?.ollama?.models || [];
  const modelOpts = [...new Set([s.llm.model, ...models])].map(m => `<option ${m === s.llm.model ? 'selected' : ''}>${esc(m)}</option>`).join('');
  const sel = (id, opts, val) => `<select id="${id}">${opts.map(([v, l]) => `<option value="${v}" ${v === val ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  main.innerHTML = `<div class="sechead" style="margin-top:0"><h2>Settings</h2></div>
  <div class="card"><h3>System check</h3><div id="syscheck"></div><div class="actions" style="margin-top:12px"><button class="btn sm" data-act="recheck">Re-check</button></div></div>
  <div class="card"><h3>Transcription</h3><div class="form">
    <div class="field"><span class="fl">Whisper model (bigger = more accurate, slower)</span>${sel('s-wmodel', ['tiny', 'base', 'small', 'medium', 'large-v3'].map(x => [x, x]), s.whisper.model)}</div>
    <div class="field"><span class="fl">Device</span>${sel('s-wdev', [['auto', 'Auto (GPU if available)'], ['cuda', 'GPU (CUDA)'], ['cpu', 'CPU']], s.whisper.device)}</div>
    <div class="field"><span class="fl">Language code (blank = auto-detect)</span><input class="txt" id="s-wlang" maxlength="3" placeholder="e.g. en, es, fr" value="${esc(s.whisper.language || '')}"></div></div></div>
  <div class="card"><h3>AI clip scoring (Ollama)</h3><div class="form">
    <div class="field full">${tog('s-llm', 'Use AI scoring by default', s.llm.enabled)}</div>
    <div class="field"><span class="fl">Ollama address</span><input class="txt" id="s-lhost" value="${esc(s.llm.host)}"></div>
    <div class="field"><span class="fl">Model ${models.length ? '(pulled models listed)' : '(Ollama not reachable; type a name)'}</span>
      ${models.length ? `<select id="s-lmodel">${modelOpts}</select>` : `<input class="txt" id="s-lmodel" value="${esc(s.llm.model)}">`}</div></div></div>
  <div class="card"><h3>Rendering &amp; captions</h3><div class="form">
    <div class="field"><span class="fl">Video encoder</span>${sel('s-enc', [['libx264', 'CPU (libx264) – works everywhere'], ['h264_nvenc', 'NVIDIA GPU (NVENC) – faster']], s.render.encoder)}</div>
    <div class="field"><span class="fl">Caption font (installed on this computer)</span><input class="txt" id="s-font" value="${esc(s.captions.font)}"></div>
    <div class="field full">${tog('s-loud', 'Normalize loudness (about −16 LUFS)', s.render.loudnorm)}</div></div></div>
  <div class="card"><h3>Data</h3><p class="desc" style="color:var(--muted);margin-bottom:12px">Everything is stored locally in <code>${esc(d.home)}</code> (output clips, cached downloads/transcripts, uploads). Marrow ${esc(d.version)}.</p>
    <div class="actions"><button class="btn" data-act="open-folder">📂 Open data folder</button></div></div>
  <div class="actions"><button class="btn primary lg" data-act="save-settings">Save settings</button><button class="btn ghost lg" data-act="reset-settings">Reset to defaults</button></div>`;
  paintSysCheck();
}
function paintSysCheck() {
  const box = $('#syscheck'); if (!box) return; const s = state.system;
  if (!s) { box.textContent = 'Checking…'; return; }
  const row = (cls, t, d) => `<div class="chk"><span class="dot ${cls}"></span><span><span class="t">${t}</span> <span class="d">${d}</span></span></div>`;
  box.innerHTML = row(s.ffmpeg ? 'ok' : 'bad', 'FFmpeg', s.ffmpeg ? 'found' : 'not found — install it and restart Marrow') +
    row(s.ollama.reachable ? 'ok' : 'warn', 'Ollama', s.ollama.reachable ? 'running at ' + esc(s.ollama.host) : 'not reachable at ' + esc(s.ollama.host) + ' — AI scoring will be skipped') +
    row(s.ollama.model_ready ? 'ok' : (s.ollama.reachable ? 'warn' : ''), 'Model “' + esc(s.ollama.model) + '”', s.ollama.model_ready ? 'ready' : 'not pulled — run: ollama pull ' + esc(s.ollama.model)) +
    row(s.gpu ? 'ok' : '', 'CUDA GPU', s.gpu ? 'detected' : 'not detected — transcription will use the CPU');
}
function readSettings() {
  return {
    whisper: { model: $('#s-wmodel').value, device: $('#s-wdev').value, language: $('#s-wlang').value.trim() },
    llm: { enabled: $('[data-opt="s-llm"]').checked, host: $('#s-lhost').value.trim(), model: $('#s-lmodel').value.trim() },
    render: { encoder: $('#s-enc').value, loudnorm: $('[data-opt="s-loud"]').checked },
    captions: { font: $('#s-font').value.trim() } };
}

/* ---------- actions (event delegation) ---------- */
const actions = {
  async go() { await startProject(); },
  seg(b) { $$('button', b.parentElement).forEach(x => x.classList.toggle('on', x === b)); },
  'rm-upload'() { clearPending(); },
  async cancel() {
    try { mergeProject(await api(`/api/projects/${curProject().id}/cancel`, { method: 'POST', body: {} })); toast('Cancelling…'); } catch (e) { toast(e.message, 'bad'); }
  },
  regen() {
    const p = curProject();
    const m = openModal(`<h3>${p.status === 'done' ? 'Regenerate clips' : 'Try again'}</h3><p class="desc">Run the pipeline again with these settings. The download and transcript are cached, so this is much faster than the first run. Existing clips are replaced when it finishes.</p>
      <div id="rg-opts" style="margin:0 -18px">${optsPanel(p.settings)}</div><div class="mfoot"><button class="btn ghost" id="rg-no">Cancel</button><button class="btn primary" id="rg-go">Start</button></div>`);
    $('#rg-no', m).onclick = closeModal;
    $('#rg-go', m).onclick = async () => {
      try { const np = await api(`/api/projects/${p.id}/regenerate`, { method: 'POST', body: { settings: readOpts(m) } }); closeModal(); mergeProject(np); location.hash = '#/p/' + p.id; viewProject(); }
      catch (e) { toast(e.message, 'bad'); }
    };
  },
  async 'del-project'() {
    const p = curProject();
    const r = await confirmBox({ title: 'Delete this project?', text: `“${p.name}” and its exported clips will be removed from your disk.`, ok: 'Delete', danger: true, check: 'Also delete the cached download, transcript and uploaded file (frees disk space)' });
    if (!r.ok) return;
    try { await api(`/api/projects/${p.id}?purge=${r.checked ? 1 : 0}`, { method: 'DELETE' }); state.projects = state.projects.filter(x => x.id !== p.id); toast('Project deleted', 'ok'); location.hash = '#/projects'; }
    catch (e) { toast(e.message, 'bad'); }
  },
  async rename() {
    const p = curProject();
    const m = openModal(`<h3>Rename project</h3><div class="field" style="margin-top:12px"><input class="txt" id="rn" maxlength="120" value="${esc(p.name)}"></div><div class="mfoot"><button class="btn ghost" id="rn-no">Cancel</button><button class="btn primary" id="rn-go">Save</button></div>`);
    const go = async () => { try { mergeProject(await api(`/api/projects/${p.id}`, { method: 'PATCH', body: { name: $('#rn', m).value } })); closeModal(); } catch (e) { toast(e.message, 'bad'); } };
    $('#rn-no', m).onclick = closeModal; $('#rn-go', m).onclick = go; $('#rn', m).addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); $('#rn', m).select();
  },
  async 'open-folder'() {
    try { const d = await api('/api/open-folder', { method: 'POST', body: { project: state.route.name === 'project' ? state.route.id : null } }); toast('Opened ' + d.path, 'ok'); }
    catch (e) { toast(e.message, 'bad'); }
  },
  'clip-plat'(b) {
    const { el, c } = clipOf(b); const pl = b.dataset.plat; el.dataset.plat = pl;
    $$('.ptabs button', el).forEach(x => x.classList.toggle('on', x === b));
    const v = $('video', el); const t = v.currentTime, was = !v.paused; v.src = c.urls[pl]; v.addEventListener('loadedmetadata', () => { v.currentTime = t; if (was) v.play(); }, { once: true });
    $('[data-act="dl"]', el).href = c.urls[pl] + '&download=1';
  },
  'copy-title'(b) { copyText(clipOf(b).c.title, 'Title copied'); },
  'copy-tags'(b) { copyText(clipOf(b).c.hashtags.map(t => '#' + t).join(' '), 'Hashtags copied'); },
  'edit-clip'(b) { const { p, c } = clipOf(b); openEdit(p, c); },
  async 'del-clip'(b) {
    const { p, c } = clipOf(b);
    const r = await confirmBox({ title: 'Delete this clip?', text: `“${c.title}” will be removed from your disk.`, ok: 'Delete clip', danger: true });
    if (!r.ok) return;
    try { mergeProject(await api(`/api/projects/${p.id}/clips/${c.rank}`, { method: 'DELETE' })); toast('Clip deleted', 'ok'); } catch (e) { toast(e.message, 'bad'); }
  },
  async recheck() { $('#syscheck').textContent = 'Checking…'; await refreshSystem(); paintSysCheck(); toast('Checked'); },
  async 'save-settings'() {
    try { state.settings = await api('/api/settings', { method: 'PUT', body: readSettings() }); state.opts = null; await refreshSystem(); viewSettings(); toast('Settings saved', 'ok'); }
    catch (e) { toast(e.message, 'bad'); }
  },
  async 'reset-settings'() {
    const r = await confirmBox({ title: 'Reset settings?', text: 'Restores the defaults from config.yaml.', ok: 'Reset' }); if (!r.ok) return;
    try { state.settings = await api('/api/settings', { method: 'PUT', body: {} }); state.opts = null; await refreshSystem(); viewSettings(); toast('Settings reset', 'ok'); } catch (e) { toast(e.message, 'bad'); }
  },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'A' && b.dataset.act === 'dl') return;
  const fn = actions[b.dataset.act]; if (fn) { e.preventDefault(); fn(b); }
});
// dropping a file anywhere should upload it (never navigate away to the file)
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault(); const f = e.dataTransfer?.files?.[0]; if (!f) return;
  if (state.route.name !== 'home') { location.hash = '#/'; setTimeout(() => handleFile(f), 50); } else handleFile(f);
});

/* ---------- router & polling ---------- */
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  if (h.startsWith('p/')) return { name: 'project', id: h.slice(2) };
  if (h === 'projects') return { name: 'projects' };
  if (h === 'settings') return { name: 'settings' };
  return { name: 'home' };
}
async function render() {
  state.route = parseRoute(); closeModal(); renderSide();
  if (state.route.name === 'home') viewHome();
  else if (state.route.name === 'projects') viewProjects();
  else if (state.route.name === 'project') viewProject();
  else if (state.route.name === 'settings') { await refreshSystem(); try { state.settings = await api('/api/settings'); } catch (e) { toast(e.message, 'bad'); return; } if (state.route.name === 'settings') viewSettings(); }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
async function refresh() {
  try { state.projects = (await api('/api/projects')).projects; } catch (_) { return; }
  renderSide();
  const r = state.route.name;
  if (r === 'home') paintRecent(); else if (r === 'projects') paintProjects();
  else if (r === 'project') { const p = curProject(); if (p) paintProject(p); }
}
setInterval(() => { if (document.hidden) return; if (hasActive()) refresh(); }, 1500);
setInterval(() => { if (!document.hidden && !hasActive()) refresh(); }, 15000);
(async function init() {
  state.route = parseRoute();
  const [p, s, sys] = await Promise.allSettled([api('/api/projects'), api('/api/settings'), api('/api/system')]);
  if (p.status === 'fulfilled') state.projects = p.value.projects;
  if (s.status === 'fulfilled') state.settings = s.value;
  if (sys.status === 'fulfilled') state.system = sys.value;
  render();
})();
</script>
</body>
</html>
